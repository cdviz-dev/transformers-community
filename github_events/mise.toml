[tasks."test"]
depends = [":test:*"]

[tasks."test:0_4"]
description = "run the transformation example github_events (use `--mode review` to review and update)"
run = """cdviz-collector \
  transform \
  --disable-otel \
  --mode {{option(name="mode", default="check")}} \
  --config ./cdviz-collector.toml \
  -t github_events_0_4 \
  --input ./inputs \
  --output ./outputs/0_4
"""

