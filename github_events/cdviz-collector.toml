# Example of source configuration
#
# [sources.github_webhook]
# enabled = true
# transformer_refs = ["github_events"]

# [sources.github_webhook.extractor]
# type = "webhook"
# id = "000-github"
# headers_to_keep = []

# [sources.github_webhook.extractor.headers]
# # token override by environment variable reads from the secret
# "x-hub-signature-256" = { type = "signature", signature_encoding = "hex", signature_on = "body", signature_prefix = "sha256=", token = "changeme" }

[transformers]
github_events_0_4 = { type = "vrl", template_file = "./to_v0_4.vrl" }
github_events_0_5 = { type = "vrl", template_file = "./to_v0_5.vrl" }
