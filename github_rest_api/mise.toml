[tasks.obfuscate]
description = "obfuscate some data into the samples"
run = "json-simple-obfuscator inputs/*/*.json"

[tasks."test"]
# branches excluded: timestamp is non-deterministic (uses now() when no ts_after metadata)
# Test branches manually after capture: mise run test:branches -- --mode overwrite
depends = [ ":test:*" ]

[tasks."test:workflow_runs"]
description = "test workflow_runs transformer (use `--mode review` to update expected outputs)"
usage = """
flag "--mode <mode>" default="check" help="transform mode: check or review"
"""
run = """cdviz-collector \
  transform \
  --disable-otel \
  --mode ${usage_mode} \
  --config ./cdviz-collector.toml \
  -t github_rest_workflow_runs \
  --input ./inputs/workflow_runs \
  --output ./outputs/0_5/workflow_runs
"""

