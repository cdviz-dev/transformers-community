[tasks.obfuscate]
description = "obfuscate some data into the samples"
run = "json-simple-obfuscator inputs/*.json"

[tasks."test"]
description = "run the transformation example gcp_cloudbuild_webhook (use `--mode review` to review and update)"
usage = """
flag "--mode <mode>" default="check" help="transform mode: check or review"
"""
run = """cdviz-collector \
  transform \
  --disable-otel \
  --mode ${usage_mode} \
  --config ./cdviz-collector.toml \
  -t gcp_cloudbuild_webhook \
  --input ./inputs \
  --output ./outputs/0_5
"""
