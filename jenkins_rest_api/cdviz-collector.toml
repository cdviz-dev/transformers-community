# ------------------------------------------------------------------------------
# Example of source configuration
#
# Recursively discovers every Jenkins job (any folder / multibranch-pipeline
# depth) and ingests its builds as CDEvents pipelinerun.{started,finished}.
#
# Discovery has no hardcoded job/pipeline names: the driver walks the job tree,
# telling folders/multibranch projects (which must be descended into) apart
# from buildable leaf jobs by their `_class` (containing "folder" or
# "multibranch"). New pipelines are picked up automatically on the next poll.
#
# ponytail: leaf jobs are fetched via a single `builds[...]` request (whatever
# Jenkins currently retains per the job's discard policy) - no {M,N} range
# pagination. If a job's full history exceeds what Jenkins keeps in memory, add
# per-job range chaining (see cdviz-collector's http_polling README "multi-pass"
# example) using `route: "both"` and slicing the `builds[...]{start,end}` tree.

