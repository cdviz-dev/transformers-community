# ------------------------------------------------------------------------------
# Example of source configuration
#
# Polls Linear's GraphQL API for issues updated in the current time window
# (`ts_after` .. `ts_before`) and follows the `pageInfo.endCursor` pagination.
# Linear has no REST API: requests are GraphQL `POST`.
# For a backfill, set `ts_after` to a past date (no lower bound when unset).
# `includeArchived: true` also returns the issues Linear auto-archived after closing.

# [sources.linear_graphql_api]
# enabled = true
# transformer_refs = ["linear_graphql_api"]

# [sources.linear_graphql_api.extractor]
# type                 = "http_polling"
# polling_interval     = "10m"
# parser               = "json"
# # Linear API rate limit: 1500 requests / hour per API key
# min_request_interval = "3s"
# # ts_after = "2025-01-01T00:00:00Z"
# driver_vrl = """
# query = "query($after: String, $filter: IssueFilter) { issues(first: 100, after: $after, filter: $filter, orderBy: updatedAt, includeArchived: true) { nodes { id identifier number title url priorityLabel createdAt completedAt canceledAt creator { id } assignee { id } state { id name type } team { id key name } labels { nodes { name } } projectMilestone { name } project { id name } cycle { id number } } pageInfo { hasNextPage endCursor } } }"
# ts_after = to_string!(.metadata.ts_after)
# updated_at = { "lt": to_string!(.metadata.ts_before) }
# # ts_after defaults to the beginning of time (a negative year), Linear rejects it
# if !starts_with(ts_after, "-") { updated_at.gt = ts_after }
# variables = { "after": null, "filter": { "updatedAt": updated_at } }
# cont = true
# if .response != null {
#   cont = .response.body.data.issues.pageInfo.hasNextPage == true
#   variables.after = .response.body.data.issues.pageInfo.endCursor
# }
# .requests = if cont {
#   [{
#     "url": "https://api.linear.app/graphql",
#     "method": "POST",
#     "headers": { "content-type": "application/json" },
#     "body": encode_json({ "query": query, "variables": variables }),
#     "route": "both",
#   }]
# } else {
#   []
# }
# """

# [sources.linear_graphql_api.extractor.headers]
# # personal API key: the key itself, no "Bearer " prefix (OAuth token: "Bearer <token>")
# authorization = { type = "secret", value = "lin_api_replace_me" }

[transformers]
linear_graphql_api = { type = "vrl", template_file = "./to_v0_5.vrl" }
