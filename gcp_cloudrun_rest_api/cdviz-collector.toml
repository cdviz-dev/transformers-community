# Cloud Run REST API transformer.
# Use with an http_polling source for setups without a Pub/Sub push endpoint. A ready-to-use
# source block lives in `cdviz-collector.sources.example.toml` (kept separate so this file stays
# loadable by `cdviz-collector transform` in tests). See README.md for details and limitations.

[transformers.gcp_cloudrun_rest_services]
type = "vrl"
template_file = "./services_to_v0_5.vrl"
